<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Student Registration System</h1>
        <p>Register student details, edit or delete records, and preserve data using local storage.</p>
    </header>

    <form id="registration-form">
        <div class="container">
            <label for="name">Student Name:</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="number-input">Student ID:</label>
            <input type="number" id="number-input" name="number-input" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="phone">Contact No:</label>
            <input type="tel" id="phone" name="phone" required><br><br>

            <label for="class">Class:</label>
            <input type="text" id="class" name="class" required><br><br>

            <label for="address">Address:</label>
            <textarea id="address" name="address" rows="3" required></textarea><br><br>

            <button type="submit">Register</button>
        </div>
    </form>

    <h2>Student List</h2>
    <div style="max-height: 300px; overflow-y: auto;">
        <table id="student-table" border="1">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Student ID</th>
                    <th>Email</th>
                    <th>Contact No</th>
                    <th>Class</th>
                    <th>Address</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="student-list">
                <!-- Dynamic content -->
            </tbody>
        </table>
    </div>

    <script src="index.js"></script>
</body>
</html>
